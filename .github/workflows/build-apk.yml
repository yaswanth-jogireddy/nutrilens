name: Build APK

on:
  workflow_dispatch:
  # Build automatically on every push to main, so a fresh APK is always ready.
  push:
    branches: [main]

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format
        run: dart format .

      - name: Analyze
        id: analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: Test
        id: test
        env:
          NUTRINUTRI_GEMINI_TEST_KEY: ${{ secrets.NUTRINUTRI_GEMINI_TEST_KEY }}
          NUTRINUTRI_GEMINI_BACKUP_TEST_KEY: ${{ secrets.NUTRINUTRI_GEMINI_BACKUP_TEST_KEY }}
        run: |
          set -o pipefail
          if [ -d test ] && find test -name "*_test.dart" -print -quit | grep -q .; then
            flutter test 2>&1 | tee test.log
          else
            echo "No Flutter tests found."
          fi

      - name: Create release signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Missing Android signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, and ANDROID_KEY_ALIAS in GitHub repo secrets."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties

      - name: Build release APK
        id: build
        run: |
          set -o pipefail
          build_number=$((1000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-number "$build_number" 2>&1 | tee build.log

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk nutrinutri-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nutrinutri-android-apk
          path: nutrinutri-android.apk

      # Full job logs need repo admin rights; annotations on the run page are
      # visible to anyone, so put the end of the failing output there.
      - name: Show the error on the run page
        if: failure()
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          report() {
            if [ "$1" != "failure" ] || [ ! -s "$2" ]; then
              return 0
            fi
            message=$(tail -n 60 "$2" \
              | sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=$3::$message"
          }
          report "$ANALYZE_OUTCOME" analyze.log "flutter analyze failed"
          report "$TEST_OUTCOME" test.log "flutter test failed"
          report "$BUILD_OUTCOME" build.log "APK build failed"
